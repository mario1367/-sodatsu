<title>花だより 東信</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: 日付バー → 今の見ごろカード → 年間の見ごろ暦（帯グラフ） */
:root{
  --bg:#f3f4f0; --paper:#fbfbf8; --fg:#23271f; --muted:#6a7064; --line:#d9dcd2; --chip-on:#e3ebd9; --chip-on-line:#a9bb96;
  --peak:#b8322a; --soon:#c98a1a; --early:#5f7f4a; --done:#9aa094;
  --c-sakura:#d7708a; --c-momo:#e0477a; --c-ajisai:#5b74c4; --c-koyo:#c8462c; --c-natsu:#8a5bb5; --c-other:#3f8f6a;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161814; --paper:#1f221c; --fg:#e8eae2; --muted:#9ba293; --line:#343830; --chip-on:#33402b; --chip-on-line:#5f7a4c;
  --peak:#ef6a5e; --soon:#e5ad4a; --early:#93b77b; --done:#6c7266;
  --c-sakura:#ec9ab0; --c-momo:#f27aa2; --c-ajisai:#8ea2e8; --c-koyo:#ec7a5c; --c-natsu:#b893dc; --c-other:#6cc39b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161814; --paper:#1f221c; --fg:#e8eae2; --muted:#9ba293; --line:#343830; --chip-on:#33402b; --chip-on-line:#5f7a4c;
  --peak:#ef6a5e; --soon:#e5ad4a; --early:#93b77b; --done:#6c7266;
  --c-sakura:#ec9ab0; --c-momo:#f27aa2; --c-ajisai:#8ea2e8; --c-koyo:#ec7a5c; --c-natsu:#b893dc; --c-other:#6cc39b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:grid;gap:28px}
header{display:grid;gap:6px}
.hero{grid-template-columns:auto 1fr;gap:20px;align-items:center}
.herotext{display:grid;gap:6px;min-width:0}
.logo{width:120px;height:120px;border-radius:50%;display:block}
@media (max-width:520px){.hero{grid-template-columns:1fr}.logo{width:96px;height:96px}}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,58px);line-height:1.2;margin:0;text-wrap:balance}
h1 small{font-size:.45em;font-weight:500;color:var(--muted);margin-left:.4em}
h2{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:60ch}
.tagline{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.45;margin:0 0 6px;color:var(--fg)}
.tagline span{display:inline-block}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.bar label{font-size:14px;color:var(--muted);letter-spacing:.08em;display:grid;gap:4px}
input[type=date],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:18px;min-height:48px}
.datebox{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.datebox button{min-height:48px;font-size:16px;padding:8px 16px}
button{font:inherit;cursor:pointer;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--peak);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--fg);border-color:var(--chip-on-line)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.summary{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.summary b{font-family:var(--display);font-size:20px;margin-right:4px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;display:grid;gap:6px;align-content:start;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kind{font-size:12px;letter-spacing:.06em;display:flex;align-items:center;gap:6px;color:var(--muted)}
.kind i{width:10px;height:10px;border-radius:2px;display:inline-block}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;color:var(--paper)}
.pill.peak{background:var(--peak)} .pill.soon{background:var(--soon)} .pill.early{background:var(--early)} .pill.done{background:var(--done)}
.card h3{font-family:var(--display);font-size:18px;margin:0;line-height:1.35}
.where{font-size:13px;color:var(--muted)}
.note{font-size:13.5px;margin:0}
.meter{position:relative;height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.meter span{position:absolute;inset:0 auto 0 0;border-radius:3px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.meta a{color:inherit}
.live{margin:0;font-size:13px;background:var(--bg);border-radius:6px;padding:6px 8px}
.live span{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--peak);margin-right:6px}
.live a{color:var(--muted)}
.access{font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.access summary{cursor:pointer;color:var(--muted);font-weight:500}
.access dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:8px 0}
.access dt{color:var(--muted);font-size:12px;white-space:nowrap}
.access dd{margin:0}
.maplinks{display:flex;flex-wrap:wrap;gap:6px}
.maplinks a{color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}
.maplinks a:hover{border-color:var(--muted)}
.sister{display:block;max-width:560px;width:100%;margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line);transition:transform .15s}
.sister:hover{border-color:var(--muted)}
.sister img{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:no-preference){.sister:hover{transform:translateY(-2px)}}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted)}
/* 暦 */
.cal{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.cal-in{min-width:760px;padding:12px 14px 14px;position:relative}
.row{display:grid;grid-template-columns:190px 1fr;align-items:center;min-height:26px}
.row .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.row .nm small{color:var(--muted);margin-left:4px}
.track{position:relative;height:26px;border-left:1px solid var(--line)}
.track .seg{position:absolute;top:7px;height:12px;border-radius:6px;opacity:.9}
.months{display:grid;grid-template-columns:repeat(12,1fr);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.months span{border-left:1px solid var(--line);padding-left:4px}
.grp{font-size:12px;color:var(--muted);letter-spacing:.1em;margin:10px 0 2px;border-top:1px solid var(--line);padding-top:8px}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--peak);pointer-events:none}
.today::after{content:attr(data-label);position:absolute;top:-2px;left:4px;font-size:11px;color:var(--peak);white-space:nowrap}
.fine{font-size:12.5px;color:var(--muted);max-width:70ch;margin:0}
section{display:grid;gap:12px}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
/* スマホ: 文字をひとまわり大きく、押しやすく */
@media (max-width:640px){
  body{font-size:17px;line-height:1.75}
  .eyebrow{font-size:13px}
  .lead{font-size:16px}
  .tagline{font-size:23px}
  h1{font-size:44px}
  h2{font-size:24px}
  .bar{gap:14px 16px}
  .bar label,.bar span[style]{font-size:16px!important}
  input[type=date],select{font-size:19px;padding:10px 12px;min-height:52px}
  .datebox button{min-height:52px;font-size:17px;flex:1}
  .datebox label{flex:1 1 100%}
  .datebox input{width:100%;box-sizing:border-box}
  button{font-size:15px;padding:7px 14px;white-space:nowrap}
  .datebox{flex-wrap:wrap}
  .summary{font-size:16px}
  .summary b{font-size:24px}
  .summary span[style]{font-size:14px!important}
  .grid{grid-template-columns:1fr;gap:16px}
  .card{padding:16px 18px 14px;gap:8px}
  .kind{font-size:14px}
  .pill{font-size:14px;padding:3px 12px}
  .card h3{font-size:21px}
  .where{font-size:15px}
  .note{font-size:16px}
  .live{font-size:15px;padding:8px 10px}
  .live span{font-size:12px}
  .meta{font-size:14px}
  .access{font-size:15px}
  .access summary{font-size:15px;padding:4px 0}
  .access dt{font-size:13px}
  .maplinks a{font-size:14px;padding:6px 12px}
  .row .nm{font-size:14px}
  .months{font-size:12px}
  .grp{font-size:13px}
  .fine{font-size:14px}
  .empty{font-size:16px}
}
</style>

  <p class="fine">「現地情報」の付いたカードは、観光協会や紅葉情報サイトの発表を週2回確認して反映しています。それ以外は例年の目安で、その年の気温や標高によって1〜2週間前後します。お出かけ前は各カードの「最新情報を調べる」から、自治体・観光協会の発表を確認してください。標高はおおよその値です。駐車場の料金や店の営業は変わることがあるので、地図や公式サイトで確認してください。</p>

 {n:"大法寺の紅葉",k:"koyo",a:"青木村",alt:640,p:[11,1,11,15],t:"国宝「見返りの塔」三重塔を紅葉が囲む。"}
];
// 駐車場・食事（目安。料金や営業は変わることがあるので現地・公式で確認）
const UEDA={q:"上田城跡公園",park:"公園内に無料駐車場あり。まつり期間や休日は混み合う。",eat:["刀屋（そば。上田駅方面）","上田駅前の商店街"]};
const KAIKO={q:"小諸城址懐古園",park:"懐古園駐車場 約210台・1回500円。",eat:["そば蔵 丁子庵","草笛 小諸本店（懐古園入口前のそば店）"]};
const KUMOBA={q:"雲場池",park:"池に専用駐車場はなし。六本辻周辺の町営・民間の有料駐車場を利用。紅葉期は満車が多く、徒歩やレンタサイクルが便利。",eat:["ベーカリー＆レストラン 沢村 旧軽井沢","万平ホテル（カフェテラス）","旧軽井沢銀座通り"]};
const ONGAKU={q:"信州国際音楽村",park:"無料駐車場あり。",eat:[]};
const IKENO={q:"池の平湿原 駐車場",park:"池の平駐車場 普通車約100台・有料（500〜600円）。地蔵峠から林道で向かう。",eat:[]};
const ACCESS={
 "上田城跡公園の桜":UEDA,"上田城跡公園の紅葉":UEDA,"懐古園の桜":KAIKO,"懐古園の紅葉":KAIKO,
 "軽井沢の大山桜":KUMOBA,"雲場池の紅葉":KUMOBA,
 "信州国際音楽村のスイセン":ONGAKU,"信州国際音楽村のラベンダー":ONGAKU,
 "池の平湿原の高山植物":IKENO,"池の平湿原・湯の丸の紅葉":IKENO,
 "龍岡城五稜郭の桜":{q:"龍岡城五稜郭",park:"隣の五稜郭であいの館に無料駐車場あり。",eat:[]},
 "津金寺のしだれ桜":{q:"津金寺 立科",park:"参拝者用の駐車場あり。",eat:[]},
 "余里の一里花桃":{q:"余里の一里花桃",park:"花桃まつりの期間は臨時駐車場が用意される。",eat:[]},
 "湯の丸高原のレンゲツツジ":{q:"湯の丸高原 地蔵峠",park:"地蔵峠の湯の丸高原駐車場からつつじ平へ歩く。",eat:[]},
 "貞祥寺のあじさい":{q:"貞祥寺 佐久",park:"境内に駐車場あり。",eat:[]},
 "佐久コスモス街道":{q:"佐久コスモス街道",park:"沿道の駐車スペースは少なめ。路上駐車はしないように。",eat:[]},
 "高峰高原の紅葉":{q:"高峰高原 車坂峠",park:"車坂峠・高峰高原ホテル周辺に無料駐車場あり。",eat:["高峰高原ホテルのレストラン"]},
 "白樺湖の紅葉":{q:"白樺湖",park:"湖畔に無料・有料の駐車場が点在。",eat:[]},
 "女神湖の紅葉":{q:"女神湖",park:"湖畔に無料駐車場あり。",eat:[]},
 "八千穂高原の白樺黄葉":{q:"八千穂高原 駒出池",park:"駒出池・八千穂高原自然園に駐車場あり。",eat:[]},
 "旧碓氷峠見晴台":{q:"旧碓氷峠見晴台",park:"見晴台近くに駐車場あり。紅葉期の休日は満車になりやすい。",eat:["しげの屋（熊野皇大神社前、名物の力餅）"]},
 "白糸の滝の紅葉":{q:"白糸の滝 軽井沢",park:"滝入口に約200台。途中の白糸ハイランドウェイは有料（普通車500円）。",eat:["里山のかまど炊きご飯 御厨","アトリエ・ド・フロマージュ 軽井沢発地市庭店"]},
 "内山峡の紅葉":{q:"内山峡",park:"国道254号沿いの駐車スペースから眺める。",eat:[]},
 "鹿教湯温泉の紅葉":{q:"鹿教湯温泉 五台橋",park:"温泉街に駐車場あり。",eat:["温泉街の旅館の食事処・日帰り入浴"]},
 "前山寺・塩田平の紅葉":{q:"前山寺 上田",park:"参拝者用の駐車場あり。",eat:["前山寺のくるみおはぎ（予約制）"]},
 "大法寺の紅葉":{q:"大法寺 青木村",park:"参拝者用の駐車場あり。",eat:[]}
};
const gmap=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const AREAS=["軽井沢町","御代田町","小諸市","佐久市","佐久穂町","立科町","東御市","上田市","青木村","長和町"].filter(a=>SPOTS.some(s=>s.a===a));
let REPORT={checked:null,items:{}};try{REPORT=JSON.parse(document.getElementById("report").textContent)}catch(e){}
const STATUS={peak:"見ごろ",soon:"もうすぐ",early:"これから",done:"見ごろ終わり"};

const $=s=>document.querySelector(s);
const dateEl=$("#d"), areaEl=$("#area");
let activeKinds=new Set(Object.keys(KINDS));
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function doy(m,d){return Math.round((Date.UTC(2001,m-1,d)-Date.UTC(2001,0,1))/864e5)} // 平年基準 0..364
function fmt(m,d){return m+"/"+d}
function reportFor(s,date){
  const r=REPORT.items&&REPORT.items[s.n]; if(!r||!REPORT.checked) return null;
  const [y,m,d]=REPORT.checked.split("-").map(Number); const diff=(date-new Date(y,m-1,d))/864e5;
  return (diff>=-3&&diff<=7)?r:null; // 確認日の前後1週間だけ現地情報を優先
}
function judge(s,date){
  const r=reportFor(s,date);
  if(r){const base=judgeTypical(s,date);return {...base,st:r.st,label:r.label,rep:r,prog:r.st==="peak"?(base.st==="peak"?base.prog:.5):0}}
  return judgeTypical(s,date);
}
function judgeTypical(s,date){
  const t=doy(date.getMonth()+1,date.getDate()), a=doy(s.p[0],s.p[1]), b=doy(s.p[2],s.p[3]);
  if(t>=a&&t<=b) return {st:"peak",prog:(t-a)/Math.max(1,b-a),days:b-t};
  const until=(a-t+365)%365, since=(t-b+365)%365;
  if(until<=14) return {st:"soon",days:until};
  if(since<=30) return {st:"done",days:since};
  return {st:"early",days:until};
}

// controls
AREAS.forEach(a=>{const o=document.createElement("option");o.value=a;o.textContent=a;areaEl.appendChild(o)});
const kindsEl=$("#kinds");
Object.entries(KINDS).forEach(([k,v])=>{
  const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.k=k;b.setAttribute("aria-pressed","true");
  b.innerHTML=`<span class="dot" style="background:var(${v.color})"></span>${v.label}`;
  b.onclick=()=>{activeKinds.has(k)?activeKinds.delete(k):activeKinds.add(k);if(!activeKinds.size)activeKinds=new Set(Object.keys(KINDS));syncChips();render()};
  kindsEl.appendChild(b);
});
function syncChips(){kindsEl.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",activeKinds.has(b.dataset.k)))}
dateEl.value=iso(today());
dateEl.onchange=render;
$("#todayBtn").onclick=()=>{dateEl.value=iso(today());render()};
$("#wkBtn").onclick=()=>{const d=today();d.setDate(d.getDate()+7);dateEl.value=iso(d);render()};
const savedArea=store("hd-area"); if(savedArea!==null&&AREAS.includes(savedArea)) areaEl.value=savedArea;
areaEl.onchange=()=>{store("hd-area",areaEl.value);render()};

function selDate(){const v=dateEl.value; if(!v) return today(); const [y,m,d]=v.split("-").map(Number); return new Date(y,m-1,d)}
function filtered(){return SPOTS.filter(s=>activeKinds.has(s.k)&&(!areaEl.value||s.a===areaEl.value))}

function render(){
  const date=selDate(), list=filtered().map(s=>({...s,j:judge(s,date)}));
  const isToday=iso(date)===iso(today());
  $("#nowTitle").textContent=(isToday?"今日":`${date.getMonth()+1}月${date.getDate()}日`)+"の見ごろ";
  const cnt=st=>list.filter(s=>s.j.st===st).length;
  $("#summary").innerHTML=`<span><b style="color:var(--peak)">${cnt("peak")}</b>か所が見ごろ</span><span><b style="color:var(--soon)">${cnt("soon")}</b>か所がもうすぐ</span>`+(REPORT.checked&&list.some(s=>s.j.rep)?`<span style="color:var(--muted);font-size:13px;align-self:center">現地情報 ${+REPORT.checked.slice(5,7)}/${+REPORT.checked.slice(8)} 確認</span>`:"");
  const order={peak:0,soon:1,done:2,early:3};
  const shown=list.filter(s=>s.j.st==="peak"||s.j.st==="soon").sort((x,y)=>order[x.j.st]-order[y.j.st]||(x.j.st==="peak"?x.j.days-y.j.days:x.j.days-y.j.days));
  const cards=$("#cards");
  if(!shown.length){
    const next=list.filter(s=>s.j.st==="early").sort((x,y)=>x.j.days-y.j.days)[0];
    cards.innerHTML=`<div class="empty">この条件で見ごろの名所はありません。${next?`次は<strong>${next.n}</strong>（${fmt(next.p[0],next.p[1])}ごろから、あと${next.j.days}日）です。`:""}種類やエリアを広げるか、日付を変えてみてください。</div>`;
  } else cards.innerHTML=shown.map(card).join("");
  drawCal(list,date);
}
function card(s){
  const K=KINDS[s.k], j=s.j;
  let line, pct=0;
  if(j.rep){pct=j.st==="peak"?Math.round((j.prog||.5)*100):0; line=j.rep.label;}
  else if(j.st==="peak"){pct=Math.round(j.prog*100); line=j.prog<.34?"見ごろの始まり":j.prog<.67?"見ごろの真っ盛り":"見ごろ後半・あと"+j.days+"日ほど";}
  else line=`あと${j.days}日ほどで見ごろ`;
  const q=encodeURIComponent(s.n.replace(/の(桜|紅葉|白樺黄葉)$/,"")+" "+(s.k==="koyo"?"紅葉":K.label)+" 見頃 "+new Date().getFullYear());
  return `<article class="card">
    <div class="top"><span class="kind"><i style="background:var(${K.color})"></i>${K.label}</span><span class="pill ${j.st}">${j.label||STATUS[j.st]}</span></div>
    <h3>${s.n}</h3>
    <div class="where">${s.a}・標高 約${s.alt.toLocaleString()}m</div>
    <p class="note">${s.t}</p>
    ${j.rep?`<p class="live"><span>現地情報</span>${j.rep.note} <a href="${j.rep.url}" target="_blank" rel="noopener">${j.rep.src} ↗</a></p>`:""}
    ${accessBlock(s)}
    <div class="meter" aria-hidden="true"><span style="width:${j.st==="peak"?Math.max(6,pct):3}%;background:var(${j.st==="peak"?"--peak":"--soon"})"></span></div>
    <div class="meta"><span>例年 ${fmt(s.p[0],s.p[1])}〜${fmt(s.p[2],s.p[3])}・${line}</span><a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">最新情報を調べる ↗</a></div>
  </article>`;
}
function accessBlock(s){
  const a=ACCESS[s.n]; if(!a) return "";
  const near=a.q.split(" ")[0];
  return `<details class="access"><summary>駐車場・食事</summary>
    <dl><dt>駐車場</dt><dd>${a.park}</dd>
    <dt>食事・カフェ</dt><dd>${a.eat.length?a.eat.join("、"):"近くの店は地図から探せます。"}</dd></dl>
    <div class="maplinks"><a href="${gmap(a.q)}" target="_blank" rel="noopener">地図</a><a href="${gmap(near+" 駐車場")}" target="_blank" rel="noopener">近くの駐車場</a><a href="${gmap(near+" カフェ")}" target="_blank" rel="noopener">近くのカフェ</a><a href="${gmap(near+" 食事")}" target="_blank" rel="noopener">近くの食事処</a></div>
  </details>`;
}
function drawCal(list,date){
  const el=$("#cal"), Y=365, pos=x=>(x/Y*100).toFixed(2)+"%";
  let h=`<div class="row"><div></div><div class="months">${Array.from({length:12},(_,i)=>`<span>${i+1}月</span>`).join("")}</div></div>`;
  const byK={};list.forEach(s=>(byK[s.k]??=[]).push(s));
  Object.keys(KINDS).forEach(k=>{
    if(!byK[k])return;
    h+=`<div class="grp">${KINDS[k].label}</div>`;
    byK[k].sort((a,b)=>doy(a.p[0],a.p[1])-doy(b.p[0],b.p[1])).forEach(s=>{
      const a=doy(s.p[0],s.p[1]), b=doy(s.p[2],s.p[3]);
      const peak=s.j.st==="peak";
      h+=`<div class="row" title="${s.n} 例年${fmt(s.p[0],s.p[1])}〜${fmt(s.p[2],s.p[3])}"><div class="nm">${peak?"● ":""}${s.n}<small>${s.a}</small></div><div class="track"><span class="seg" style="left:${pos(a)};width:${pos(b-a+1)};background:var(${KINDS[k].color});${peak?"outline:2px solid var(--fg);outline-offset:1px":""}"></span></div></div>`;
    });
  });
  if(!list.length) h+=`<div class="grp">条件に合う名所がありません</div>`;
  el.innerHTML=h;
  const t=doy(date.getMonth()+1,date.getDate());
  const line=document.createElement("div");line.className="today";line.dataset.label=`${date.getMonth()+1}/${date.getDate()}`;
  line.style.left=`calc(14px + 190px + (100% - 28px - 190px) * ${t/Y})`;
  el.appendChild(line);
}
render();
</script>

</body>
</html>
