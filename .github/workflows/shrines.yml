# 月に1回、日本じゅうの神社の場所を地図（OpenStreetMap）から集めなおして shrines/ に置き、公開しなおす
name: Update shrine list

on:
  schedule:
    - cron: '0 18 1 * *'
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['tools/shrines.mjs', '.github/workflows/shrines.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: shrines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/shrines.mjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898732+github-actions[bot]@users.noreply.github.com'
          git add shrines
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m '神社の一覧を更新'
          git push
          # GITHUB_TOKEN の push では公開が動かないので、main のときは公開を呼ぶ
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then gh workflow run pages.yml --ref main; fi
        env:
          GH_TOKEN: ${{ github.token }}
